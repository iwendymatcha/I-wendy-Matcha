{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white text-center">
            <div class="mb-3 text-center">
                <img src="{{ url_for('static', filename='images/admin_logo.jpeg') }}" 
                     alt="Admin Logo" 
                     class="rounded-circle shadow-sm border border-2 border-dark bg-white p-2" 
                     style="width: 110px; height: 110px; object-fit: contain; image-rendering: pixelated;">
            </div>

            <h3 class="fw-bold text-dark mb-1">ผู้ดูแลระบบ</h3>
            <p class="text-muted small mb-4">กรุณากรอก Secret Key</p>

            <form action="{{ url_for('secret_admin') }}" method="POST">
                <div class="mb-4">
                    <label class="form-label fw-bold text-dark"></label>
                    <input type="password" name="secret_code" class="form-control form-control-lg text-center fw-bold fs-4 rounded-3" 
                           placeholder="••••••••" required autofocus>
                </div>

                <button type="submit" class="btn btn-dark w-100 py-3 rounded-pill fs-5 shadow">
                    <i class="fa-solid fa-unlock-keyhole me-1"></i> ปลดล็อกสิทธิ์แอดมิน
                </button>
            </form>

            <div class="mt-4 pt-3 border-top">
                <a href="{{ url_for('index') }}" class="text-decoration-none text-muted small">
                    <i class="fa-solid fa-arrow-left me-1"></i> กลับไปยังหน้าร้าน
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
