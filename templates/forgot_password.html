{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 rounded-4 p-4 p-md-5 bg-white position-relative overflow-hidden shadow" 
             style="border: 1.5px solid #bdd9e7 !important; box-shadow: 0 15px 35px rgba(189, 217, 231, 0.3) !important;">
            <!-- Top Gradient Accent Line: เขียวมัทฉะ, ครีมเนย, ชมพู April -->
            <div style="height: 5px; background: linear-gradient(90deg, #a9b762 0%, #faf8ec 48%, #f8a9be 100%); position: absolute; top: 0; left: 0; right: 0;"></div>

            <div class="text-center mb-4">
                <!-- Store Logo: Identical to Receipt Slip -->
                <div class="mb-3">
                    <img src="{{ url_for('static', filename='images/logo_nav.png') }}" 
                         alt="I wendy Matcha Logo" 
                         style="max-height: 58px; width: auto; object-fit: contain;">
                </div>
                <h4 class="fw-bold text-dark mb-1">ลืมรหัสผ่าน (Forgot Password)</h4>
                <p class="text-muted small">กรอกอีเมลของคุณเพื่อรับรหัส OTP สำหรับตั้งรหัสผ่านใหม่</p>
            </div>

            <form action="{{ url_for('forgot_password') }}" method="POST">
                <div class="mb-4">
                    <label class="form-label fw-semibold text-dark small">
                        <i class="fa-regular fa-envelope text-muted me-1"></i> อีเมลของคุณ (Email Address)
                    </label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-at text-muted"></i></span>
                        <input type="text" name="identifier" class="form-control border-start-0 py-2" 
                               value="{{ identifier or '' }}" placeholder="customer@email.com หรือ username" required autofocus>
                    </div>
                    <small class="text-muted d-block mt-1 ps-1" style="font-size: 0.75rem;">
                        <i class="fa-solid fa-circle-info me-1 text-matcha"></i> ระบบจะส่งรหัสยืนยัน OTP 6 หลักไปยังอีเมลที่ลงทะเบียนไว้
                    </small>
                </div>

                <button type="submit" class="btn btn-matcha w-100 py-3 rounded-pill fs-6 fw-bold shadow-sm d-flex align-items-center justify-content-center gap-2">
                    <i class="fa-solid fa-paper-plane"></i>
                    <span>ส่งรหัส OTP ไปยังอีเมล</span>
                </button>
            </form>

            <div class="text-center mt-4 pt-3 border-top">
                <a href="{{ url_for('login') }}" class="text-decoration-none text-muted small">
                    <i class="fa-solid fa-arrow-left me-1"></i> กลับไปหน้าเข้าสู่ระบบ
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
